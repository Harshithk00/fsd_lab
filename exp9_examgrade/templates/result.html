<h2>Students with O Grade</h2>
<table border="1">
<tr><th>Name</th><th>USN</th><th>Subject</th><th>Marks</th><th>Grade</th></tr>
{% for s in data %}
<tr><td>{{ s.name }}</td><td>{{ s.usn }}</td><td>{{ s.subject }}</td><td>{{ s.marks }}</td><td>{{ s.grade }}</td></tr>
{% endfor %}
</table>
